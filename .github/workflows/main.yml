name: Unity CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      # 1. REQUIRED: Free up space for the Unity Image
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space-action@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # 2. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 3. Cache Library (Speeds up future checks)
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 4. THE CHANGE: Use Test Runner instead of Builder
      - name: Check for Errors (Test Runner)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # 'editmode' is fastest. It compiles your scripts and runs editor tests.
          # If your code has syntax errors, this step will fail immediately.
          testMode: editmode
          customParameters: '-warningsAsErrors'
