name: Build project

on: [push, pull_request]

jobs:
  buildForAllSupportedPlatforms:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneOSX # Build a macOS standalone (Intel 64-bit).
          - StandaloneWindows # Build a Windows standalone.
          - StandaloneWindows64 # Build a Windows 64-bit standalone.
          - StandaloneLinux64 # Build a Linux 64-bit standalone.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Show disk usage (diagnose)
        run: df -h || true

      # Cache the Unity Library folder (project import cache)
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      # Cache Unity editor and related caches to avoid re-downloading/extracting huge Unity images
      - name: Cache Unity editor and caches
        uses: actions/cache@v3
        with:
          path: |
            /opt/unity
            ~/.cache/unity3d
            ~/.config/unity3d
          # Include project Unity version and platform in key to avoid cross-version cache pollution
          key: unity-editor-${{ matrix.targetPlatform }}-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            unity-editor-${{ matrix.targetPlatform }}-

      # Best-effort free space before pulling large images
      - name: Prune Docker to free space (best-effort)
        if: runner.os == 'Linux'
        run: |
          docker system prune -af || true
          docker image prune -af || true

      - name: Build with game-ci Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          # Enable the builder's cache behavior so it reuses the Library and any editor caches when present
          cache: true
          cache-name: Library-${{ matrix.targetPlatform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
