name: Unity CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      # 1. FIX: Manually delete files to avoid "Repository not found" errors
      # This replaces the external action that was failing.
      - name: Free Disk Space (Manual)
        run: |
          echo "Freeing up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/swift
          echo "Disk space freed!"

      # 2. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 3. Cache Library (Speeds up future checks)
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # 4. Test Runner (Checks for Errors & Warnings)
      - name: Check for Errors (Test Runner)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          customParameters: '-warningsAsErrors'
